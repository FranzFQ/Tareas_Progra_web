<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea-02</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="login_page">
        <div class="left">
            <h1 class="tile"></h1>
            <h1 class="subtitle"></h1>
            <p></p>
            <div class="accounts">
                <button class="first_account"></button>
                <button class="second_account"></button>
            </div>
        </div>
        <div class="right">
            <div class="login_box">
                <label for="" class="user_data"></label>
                <label for="" class="password"></label>
                <button class="sign_in"></button>
                <p class="forget_password"></p>
                <button class="sign_up"></button>
                <p class="information"></p>
            </div>
        </div>
        <div class="bottom">
            <div class="change_language">
                <p class="language"></p>
                <button class="plus"></button>
                <p class="compani_information"></p>
                <p class="copy_rights"></p>
            </div>
        </div>
    </div>
</body>
</html>
